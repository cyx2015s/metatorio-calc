[workspace]
resolver = "2"
members = [
    "crates/metatorio-lp",
    "crates/metatorio-solver",
    "crates/metatorio-data",
    "crates/metatorio-data-codegen", 
    "crates/metatorio-core",
    "crates/metatorio-runtime",
    "crates/metatorio-icons",
    "crates/metatorio-shell",
    "crates/metatorio-headless",
    "metatorio-app/src-tauri",
]

[patch.crates-io]
# Locally patched SoPlex 7.1.2 build: C++17/EHsc on MSVC and the
# libsoplex.lib -> soplex.lib link-name fix. See vendor/soplex-sys/README.metatorio.md.
soplex-sys = { path = "vendor/soplex-sys" }

# The default LP backend performs large floating and rational calculations.
# Keep its hot path optimized in desktop development builds as well.
[profile.dev.package.metatorio-lp]
opt-level = 3

[profile.dev.package.metatorio-solver]
opt-level = 3

[profile.dev.package.num-bigint]
opt-level = 3

[profile.dev.package.num-rational]
opt-level = 3

[profile.dev.package.num-integer]
opt-level = 3

[profile.dev.package.num-traits]
opt-level = 3
