[package]
name = "metatorio"
version = "1.2.46"
edition = "2024"

[dependencies]
dirs = "6"
dyn-clone = "1"
eframe = { version = "0.33" }
egui = { version = "0.33", features = ["rayon"] }
egui-toast = "0.19"
egui_dnd = "0.14"
egui_extras = { version = "0.33", features = ["file", "image"] }
egui_logger = { version = "0.1.0", path = "egui_logger" }
fontdb = "0.23.0"
good_lp = { git = "https://github.com/cyx2015s/good_lp", branch = "inspect_constraint", default-features = false, features = ["microlp"] }
image = { version = "0.25.9", default-features = false, features = ["png", "rayon"] }
indexmap = { version = "2.13.0", features = ["rayon", "serde"] }
log = "0.4.29"
mimalloc = "0.1.48"
rayon = "1.11.0"
regex = "1.12.2"
reqwest = { version = "0.13.1", default-features = false, features = ["blocking", "rustls"] }
rfd = "0.16.0"
self_update = "0.42.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_with = "3.16.1"
tempfile = "3.24.0"
typetag = "0.2.21"

[build-dependencies]
winresource = "0.1.30"
# build.rs

[features]
default = []
wgpu = ["eframe/wgpu"]
