[package]
name = "metatorio-app"
version = "1.5.5"
description = "切向量化：异星工厂规划工具"
authors = ["cyx2015s"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "metatorio_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
metatorio-core = { path = "../../crates/metatorio-core" }
metatorio-data = { path = "../../crates/metatorio-data" }
metatorio-runtime = { path = "../../crates/metatorio-runtime" }
metatorio-solver = { path = "../../crates/metatorio-solver" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# MCP server (merged into the app binary, Streamable-HTTP on localhost).
rmcp = { version = "3.2", features = ["transport-streamable-http-server"] }
# 工具参数派生 JsonSchema 需要直接依赖 schemars（derive 展开引用 ::schemars）。
schemars = { version = "1", features = ["chrono04"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync"] }
