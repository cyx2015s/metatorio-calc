[package]
name = "metatorio-app"
version = "1.6.6"
description = "切向量化：异星工厂规划工具"
authors = ["cyx2015s"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "metatorio_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["all-lp"]
all-lp = ["clarabel", "highs", "microlp", "rust-lp", "soplex"]
clarabel = ["metatorio-runtime/clarabel", "metatorio-shell/clarabel"]
highs = ["metatorio-runtime/highs", "metatorio-shell/highs"]
microlp = ["metatorio-runtime/microlp", "metatorio-shell/microlp"]
rust-lp = ["metatorio-runtime/rust-lp", "metatorio-shell/rust-lp"]
soplex = ["metatorio-runtime/soplex", "metatorio-shell/soplex"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 业务逻辑全在 metatorio-shell（GUI 无关）；这里只留 Tauri 外壳真正用到的东西。
metatorio-core = { path = "../../crates/metatorio-core" }
metatorio-runtime = { path = "../../crates/metatorio-runtime", default-features = false }
metatorio-shell = { path = "../../crates/metatorio-shell", default-features = false }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync"] }
clap = { version = "4.6.6", features = ["derive", "env"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
