[package]
name = "metatorio-solver"
version = "0.1.0"
edition = "2024"
description = "Metatorio 求解器内核：线性规划求解与组合枚举，无 UI 依赖"
license = "MIT"

[features]
default = ["rust-lp"]
highs = ["dep:good_lp", "good_lp/highs", "dep:highs", "dep:highs-sys"]
rust-lp = ["rational-lp", "dep:serde_json", "dep:num-rational", "dep:num-traits"]
rational-lp = ["dep:metatorio-lp"]
lp-experiments = ["highs", "rust-lp"]

[dependencies]
ahash = { version = "0.8", features = ["serde"] }
good_lp = { version = "1.15", default-features = false, optional = true }
indexmap = { version = "2", features = ["rayon", "serde"] }
log = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
highs = { version = "2.4", optional = true }
highs-sys = { version = "1.15", optional = true }
serde_json = { version = "1", optional = true }
num-rational = { version = "0.4", optional = true }
num-traits = { version = "0.2", optional = true }
metatorio-lp = { path = "../metatorio-lp", optional = true }

[[example]]
name = "lp_replay"
required-features = ["lp-experiments"]

[[example]]
name = "lp_certify"
required-features = ["rust-lp"]

[[example]]
name = "lp_from_zero"
required-features = ["rust-lp"]

