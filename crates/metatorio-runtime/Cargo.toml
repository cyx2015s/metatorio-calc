[package]
name = "metatorio-runtime"
version = "0.1.0"
edition = "2024"
description = "Metatorio application document model and framework-independent messages"
license = "MIT"

[features]
default = ["all-lp"]
all-lp = ["clarabel", "highs", "microlp", "rust-lp", "soplex"]
clarabel = ["metatorio-solver/clarabel"]
highs = ["metatorio-solver/highs"]
microlp = ["metatorio-solver/microlp"]
rust-lp = ["metatorio-solver/rust-lp"]
soplex = ["metatorio-solver/soplex"]

[dependencies]
metatorio-data = { path = "../metatorio-data" }
metatorio-core = { path = "../metatorio-core" }
metatorio-solver = { path = "../metatorio-solver", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 为 AppMessage 派生 JsonSchema（供 MCP dispatch 工具生成 inputSchema）。
schemars = { version = "1", features = ["chrono04"] }

[dev-dependencies]
