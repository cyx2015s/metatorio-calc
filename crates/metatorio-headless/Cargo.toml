[package]
name = "metatorio-headless"
version = "1.5.33"
edition = "2024"
description = "切向量化：纯 MCP 服务（无 GUI，不链接 tauri/webview/GTK）"

# 只依赖 metatorio-shell：**不依赖 tauri**。因此这个二进制在 Linux 上不会被迫
# 链接 GTK，也不需要 xvfb——这是「真 headless」的关键。

[features]
default = ["rust-lp"]
highs = ["metatorio-shell/highs"]
rust-lp = ["metatorio-shell/rust-lp"]

[dependencies]
metatorio-shell = { path = "../metatorio-shell", default-features = false }
serde_json = "1"
clap = { version = "4.6.6", features = ["derive", "env"] }
