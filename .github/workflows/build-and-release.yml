name: Build and Release (Tauri)

# 编译并发布 Tauri 桌面应用（Linux + Windows），附带 tauri-plugin-updater 更新产物。
# macOS 因签名需要付费证书，暂不构建。
on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 → AppImage（镜像自替换，配合 updater）
          - platform: ubuntu-22.04
            args: '--bundles appimage'
            name: linux-x86_64
          # Windows x86_64 → NSIS setup.exe（静默升级）
          - platform: windows-latest
            args: '--bundles nsis'
            name: windows-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Tauri v2 在 Linux 上需要这几个系统库。
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'
          cache-dependency-path: metatorio-app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: metatorio-app
        run: pnpm install --frozen-lockfile

      # Tauri 构建由 tauri-action 完成；它调用 `pnpm build`（beforeBuildCommand）并打包。
      # 若需 updater 签名，必须在仓库 Secrets 里配置：
      #   TAURI_SIGNING_PRIVATE_KEY          （`pnpm tauri signer generate` 生成的私钥）
      #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD （私钥密码）
      # 并把公钥写入 metatorio-app/src-tauri/tauri.conf.json 的 plugins.updater.pubkey。
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: metatorio-app
          tagName: v__VERSION__
          releaseName: 'metatorio v__VERSION__'
          releaseBody: |
            见各平台的安装包 / 更新镜像：
            - Windows: NSIS setup.exe
            - Linux: AppImage
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
